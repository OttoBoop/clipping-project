name: Send Invites
run-name: Send invites — Penelope

# Triggered manually (workflow_dispatch) or by pushing a trigger file at
# INVITATION EMAIL/mailer/pending-send.url.
#
# Credential modes (resolved inside the single "Resolve and send" step):
#   - OTS mode: a one-time-secret URL (carrying GMAIL_USER + GMAIL_APP_PASSWORD)
#     is supplied via the dispatch input or the trigger file. The runner
#     fetches + burns it.
#   - Repo-secret mode: NO url is supplied -> the runner reads the GMAIL_USER /
#     GMAIL_APP_PASSWORD repo secrets instead. Nothing sensitive enters git.
#
# Why this workflow exists: the Claude Code sandbox has no outbound network
# (egress proxy returns 403), so retrieve_and_send.py can't run there. GitHub
# runners have open egress to onetimesecret.com and smtp.gmail.com:465.
#
# The whole resolve+auth+send is ONE step so there is no fragile cross-step
# output passing; everything it prints is tee'd to /tmp/send.log and committed
# to mailer/last-run-status.md (push runs), so any failure is fully visible.
# The OTS URL is masked in logs; the repo-secret App Password is written to a
# 0600 file in $RUNNER_TEMP only for the SMTP session and scrubbed afterwards.

on:
  workflow_dispatch:
    inputs:
      secret_url:
        description: 'One-time-secret URL (GMAIL_USER=... and GMAIL_APP_PASSWORD=... on separate lines). Leave EMPTY to use the GMAIL_USER / GMAIL_APP_PASSWORD repo secrets instead.'
        required: false
        type: string
      dry_run:
        description: 'Dry-run: parse + plan, do NOT contact SMTP. (Still consumes the OTS link if one is given.)'
        required: false
        type: boolean
        default: false
      subject_override:
        description: 'Optional: override the subject line from the template.'
        required: false
        type: string
        default: ''
      template_path:
        description: 'Optional: path to the template. Defaults to mailer/invite_template.txt.'
        required: false
        type: string
        default: ''
      recipients_path:
        description: 'Optional: path to a committed recipients file. Defaults to mailer/recipients.txt.'
        required: false
        type: string
        default: ''
      from_name:
        description: 'Optional: From display name, e.g. "Equipe Programadores Cariocas".'
        required: false
        type: string
        default: ''
  push:
    paths:
      - 'INVITATION EMAIL/mailer/pending-send.url'
    branches:
      - 'claude/gmail-email-invitations-**'
      - 'master'

permissions:
  contents: write

concurrency:
  group: send-invites
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve and send
        id: send
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_URL: ${{ inputs.secret_url }}
          DISPATCH_DRY: ${{ inputs.dry_run }}
          DISPATCH_SUBJECT: ${{ inputs.subject_override }}
          DISPATCH_TEMPLATE: ${{ inputs.template_path }}
          DISPATCH_RECIPIENTS: ${{ inputs.recipients_path }}
          DISPATCH_FROM_NAME: ${{ inputs.from_name }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          # GitHub Actions runs this as `bash -eo pipefail`. With errexit on,
          # the first grep that finds nothing (e.g. an absent subject=/recipients=
          # key in the trigger) returns non-zero and aborts the whole step before
          # the mailer launches. Disable errexit and handle exits explicitly.
          set +e
          LOG=/tmp/send.log
          : > "$LOG"
          log() { echo "$@" | tee -a "$LOG"; }

          TRIGGER="INVITATION EMAIL/mailer/pending-send.url"
          get_key() { grep -E "^$1=" "$2" 2>/dev/null | head -n1 | sed -E "s/^$1=//" | sed -E 's/[[:space:]]+$//'; }

          log "[diag] event=${EVENT_NAME}"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            URL="${DISPATCH_URL}"
            DRY="${DISPATCH_DRY:-false}"
            SUBJ="${DISPATCH_SUBJECT}"
            TEMPLATE="${DISPATCH_TEMPLATE}"
            RECIPIENTS="${DISPATCH_RECIPIENTS}"
            FROM_NAME="${DISPATCH_FROM_NAME}"
            log "[diag] source=dispatch_input"
          else
            if [ ! -f "$TRIGGER" ]; then
              log "[error] trigger file not found: $TRIGGER"
              exit 1
            fi
            URL="$(grep -oE 'https://[a-z0-9.-]+\.onetimesecret\.[a-z]+/secret/[A-Za-z0-9]+' "$TRIGGER" | head -n1)"
            DRY="false"
            SUBJ="$(get_key subject "$TRIGGER")"
            TEMPLATE="$(get_key template "$TRIGGER")"
            RECIPIENTS="$(get_key recipients "$TRIGGER")"
            FROM_NAME="$(get_key from_name "$TRIGGER")"
            log "[diag] source=push_trigger_file"
          fi

          log "[diag] template=${TEMPLATE:-<default>}"
          log "[diag] recipients=${RECIPIENTS:-<default mailer/recipients.txt>}"
          log "[diag] from_name=${FROM_NAME:-<none>}"
          log "[diag] subject=${SUBJ:-<from template>}"
          log "[diag] dry_run=${DRY}"

          args=()
          if [ -n "$URL" ]; then
            echo "::add-mask::$URL"
            log "[diag] auth=ots (url length ${#URL})"
            args+=( "$URL" )
          else
            log "[diag] auth=repo_secret (no OTS url supplied)"
            if [ -z "$GMAIL_USER" ] || [ -z "$GMAIL_APP_PASSWORD" ]; then
              log "[error] No OTS url and repo secrets GMAIL_USER / GMAIL_APP_PASSWORD are not set."
              log "[error] Add them under Settings -> Secrets and variables -> Actions, or supply an OTS URL."
              exit 1
            fi
            CRED_FILE="$RUNNER_TEMP/creds.txt"
            ( umask 077; printf 'GMAIL_USER=%s\nGMAIL_APP_PASSWORD=%s\n' "$GMAIL_USER" "$GMAIL_APP_PASSWORD" > "$CRED_FILE" )
            args+=( --secret-file "$CRED_FILE" )
          fi
          [ "$DRY" = "true" ] && args+=( --dry-run )
          [ -n "$SUBJ" ] && args+=( --subject "$SUBJ" )
          [ -n "$TEMPLATE" ] && args+=( --template "$TEMPLATE" )
          [ -n "$RECIPIENTS" ] && args+=( --recipients "$RECIPIENTS" )
          [ -n "$FROM_NAME" ] && args+=( --from-name "$FROM_NAME" )

          log "[diag] launching mailer..."
          python3 "INVITATION EMAIL/mailer/retrieve_and_send.py" "${args[@]}" 2>&1 | tee -a "$LOG"
          CODE=${PIPESTATUS[0]}
          rm -f "$RUNNER_TEMP/creds.txt" 2>/dev/null || true
          log "[diag] mailer exit code: $CODE"
          echo "script_exit=$CODE" >> "$GITHUB_OUTPUT"
          exit "$CODE"

      - name: Record run status (push only)
        if: github.event_name == 'push' && always()
        run: |
          {
            echo "# Last send-invites run"
            echo ""
            echo "- run_id: ${{ github.run_id }}"
            echo "- run_number: ${{ github.run_number }}"
            echo "- trigger sha: ${{ github.sha }}"
            echo "- script exit code: ${{ steps.send.outputs.script_exit }}"
            echo "- timestamp (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "## Run output (stdout + stderr)"
            echo ""
            echo '```'
            if [ -f /tmp/send.log ]; then
              cat /tmp/send.log
            else
              echo "(no /tmp/send.log captured — the send step did not start)"
            fi
            echo '```'
          } > "INVITATION EMAIL/mailer/last-run-status.md"

      - name: Consume trigger and commit status (push only)
        if: github.event_name == 'push' && always()
        run: |
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f "INVITATION EMAIL/mailer/pending-send.url" ]; then
            git rm "INVITATION EMAIL/mailer/pending-send.url"
          fi
          git add "INVITATION EMAIL/mailer/last-run-status.md"
          git pull --rebase origin "${GITHUB_REF##refs/heads/}" || true
          git commit -m "send-invites: consume trigger + record run status"
          git push origin "HEAD:${GITHUB_REF##refs/heads/}"

      - name: Fail job if script failed
        if: steps.send.outputs.script_exit != '0'
        run: |
          echo "::error::Send step exit code was '${{ steps.send.outputs.script_exit }}'. See INVITATION EMAIL/mailer/last-run-status.md."
          exit 1
