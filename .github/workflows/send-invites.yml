name: Send Invites
run-name: Send invites — Penelope

# Triggered manually. Otávio (or anyone with write access) clicks "Run
# workflow", pastes the one-time-secret URL into the `secret_url` input,
# and the runner consumes the secret and sends the emails.
#
# Why this workflow exists: the Claude Code sandbox has no outbound network
# (egress proxy returns 403 "Host not in allowlist"), so retrieve_and_send.py
# can't run from there. GitHub-hosted runners *do* have open egress to
# onetimesecret.com and smtp.gmail.com:465, so we run the script here.
#
# Security notes:
# - The one-time-secret URL appears in the workflow run metadata (visible
#   to anyone with read access to this repo). Since the secret is destroyed
#   the moment the workflow consumes it, the leaked URL is dead within
#   seconds of being recorded. Use a short TTL (5-15 min) for defence in
#   depth.
# - The Gmail App Password itself never appears in logs: the script holds
#   it as a local Python variable and the script doesn't echo it. The
#   ::add-mask:: directive below is belt-and-braces in case the URL itself
#   ever needs to be redacted from a later log line.
# - The GMAIL_USER value (an email address) will appear in the logs once
#   ([plan] from: <email>). If that bothers you, treat the workflow run as
#   private and delete it after the send.

on:
  workflow_dispatch:
    inputs:
      secret_url:
        description: 'One-time-secret URL. Payload must contain GMAIL_USER=... and GMAIL_APP_PASSWORD=... on separate lines.'
        required: true
        type: string
      dry_run:
        description: 'Dry-run: parse the secret and plan the send, but do NOT contact SMTP. (Still consumes the one-time-secret link.)'
        required: false
        type: boolean
        default: false
      subject_override:
        description: 'Optional: override the subject line from invite_template.txt.'
        required: false
        type: string
        default: ''
  push:
    paths:
      - 'mass_email_invites/pending-send.url'
    branches:
      - 'claude/gmail-email-invitations-**'
      - 'master'

permissions:
  contents: write

concurrency:
  group: send-invites
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve URL source (workflow_dispatch input vs. trigger file)
        id: src
        env:
          DISPATCH_URL: ${{ inputs.secret_url }}
          DISPATCH_DRY: ${{ inputs.dry_run }}
          DISPATCH_SUBJECT: ${{ inputs.subject_override }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            URL="$DISPATCH_URL"
            DRY="$DISPATCH_DRY"
            SUBJ="$DISPATCH_SUBJECT"
          else
            URL="$(head -n1 mass_email_invites/pending-send.url | tr -d '[:space:]')"
            DRY="false"
            SUBJ=""
          fi
          if [ -z "$URL" ]; then
            echo "::error::No secret URL found."
            exit 1
          fi
          echo "::add-mask::$URL"
          {
            echo "URL<<__EOF__"
            echo "$URL"
            echo "__EOF__"
            echo "DRY=$DRY"
            echo "SUBJ<<__EOF__"
            echo "$SUBJ"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Fire the invites
        env:
          OTS_URL: ${{ steps.src.outputs.URL }}
          DRY_RUN: ${{ steps.src.outputs.DRY }}
          SUBJECT_OVERRIDE: ${{ steps.src.outputs.SUBJ }}
        run: |
          set -euo pipefail
          args=( "$OTS_URL" )
          if [ "$DRY_RUN" = "true" ]; then
            args+=( --dry-run )
          fi
          if [ -n "$SUBJECT_OVERRIDE" ]; then
            args+=( --subject "$SUBJECT_OVERRIDE" )
          fi
          python3 mass_email_invites/retrieve_and_send.py "${args[@]}"

      - name: Consume the trigger file (push only)
        if: github.event_name == 'push' && always()
        run: |
          set -euo pipefail
          if [ ! -f mass_email_invites/pending-send.url ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm mass_email_invites/pending-send.url
          git commit -m "send-invites: consume trigger file (URL is one-time, now dead)"
          git push
