name: penelope-fetch-shakira

# Penelope-side workaround for the Anthropic Claude Code sandbox egress
# block on *.onrender.com. GitHub Actions runs outside that sandbox and has
# unrestricted egress, so we use it as a one-shot fetch-and-commit bridge.
#
# Triggered manually OR on any push to a Penelope branch that touches
# this workflow file. Fetches the live Shakira-enriched snapshots from
# https://clipping-project.onrender.com/ and commits them to the same
# branch under tools/penelope-fetched/, where the next Penelope session
# can read them via raw.githubusercontent.com (which IS reachable from
# the sandbox).

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/shakira-show-stage-0-NEVYj'
    paths:
      - '.github/workflows/penelope-fetch-shakira.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Probe Render reachability
        id: probe
        run: |
          set -e
          mkdir -p tools/penelope-fetched
          {
            echo "=== reachability probe ($(date -u --iso-8601=seconds)) ==="
            for url in \
              https://clipping-project.onrender.com/api/targets \
              https://clipping-project.onrender.com/assets/clipping-data.json \
              https://clipping-project.onrender.com/assets/clipping-raw-texts.json \
              https://clipping-project.onrender.com/api/update/status; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "$url" || echo ERR)
              size=$(curl -sS -o /dev/null -w '%{size_download}' --max-time 60 "$url" || echo 0)
              echo "  $code  $size  $url"
            done
          } | tee tools/penelope-fetched/PROBE.txt

      - name: Fetch live snapshot artifacts
        run: |
          set -e
          mkdir -p tools/penelope-fetched
          for path in \
            api/targets \
            assets/clipping-data.json \
            assets/clipping-raw-texts.json \
            api/update/status; do
            local="tools/penelope-fetched/$(echo "$path" | tr '/' '_')"
            echo "Fetching https://clipping-project.onrender.com/$path -> $local"
            # Note: Render free-tier may cold-start; allow long timeout.
            curl -sS --fail --max-time 180 \
              -A "Mozilla/5.0 PenelopeFetcher (GitHub Actions)" \
              "https://clipping-project.onrender.com/$path" \
              > "$local" || echo "  (failed; leaving previous if any)"
          done
          ls -la tools/penelope-fetched/
          # Quick stats so the run page shows what we got
          if [ -f tools/penelope-fetched/assets_clipping-data.json ]; then
            python3 -c "
import json
with open('tools/penelope-fetched/assets_clipping-data.json') as f:
    d = json.load(f)
print('generatedAt:', d.get('meta',{}).get('generatedAt'))
print('targets:', [t.get('key') for t in d.get('targets',[])])
sh = sum(1 for s in d.get('stories',[]) if 'shakira' in (s.get('targetKeys') or []))
sa = sum(len([a for a in s.get('articles',[]) if 'shakira' in (a.get('targetKeys') or [])]) for s in d.get('stories',[]))
print(f'shakira stories: {sh}; shakira articles: {sa}')
" || true
          fi

      - name: Commit fetched data
        run: |
          set -e
          git config user.name "Penelope (Action)"
          git config user.email "penelope+actions@noreply.users.github.com"
          git add tools/penelope-fetched/ || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "penelope/fetch: pull live Shakira snapshot from Render via GitHub Actions

The Claude Code sandbox blocks egress to *.onrender.com (issue
anthropics/claude-code#52982). This GitHub Action runs outside the
sandbox and pulls the Render snapshots so the next Penelope session
can read them via raw.githubusercontent.com.

Files in tools/penelope-fetched/:
- api_targets               (GET /api/targets)
- assets_clipping-data.json (GET /assets/clipping-data.json)
- assets_clipping-raw-texts.json (GET /assets/clipping-raw-texts.json)
- api_update_status         (GET /api/update/status)
- PROBE.txt                 (reachability probe summary)
"
            git push origin HEAD:${GITHUB_REF#refs/heads/}
          fi
